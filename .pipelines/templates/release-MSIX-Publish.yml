parameters:
  - name: skipMSIXPublish
    type: boolean

jobs:
- job: Store_Publish_MSIX
  displayName: Publish MSIX to the Microsoft Store
  pool:
    type: release
    os: windows
  templateContext:
    inputs:
      - input: pipelineArtifact
        pipeline: PSPackagesOfficial
        artifactName: drop_store_package_CreateStorePackage
  variables:
    - group: 'Store Publish Variables'
    - name: LTS
      value: $[ stageDependencies.setReleaseTagAndChangelog.setTagAndChangelog.outputs['ChannelSelection.IsLTS'] ]
    - name: STABLE
      value: $[ stageDependencies.setReleaseTagAndChangelog.setTagAndChangelog.outputs['ChannelSelection.IsStable'] ]
    - name: PREVIEW
      value: $[ stageDependencies.setReleaseTagAndChangelog.setTagAndChangelog.outputs['ChannelSelection.IsPreview'] ]
    - template: ./variables/release-shared.yml@self
      parameters:
        RELEASETAG: $[ stageDependencies.setReleaseTagAndChangelog.setTagAndChangelog.outputs['OutputReleaseTag.releaseTag'] ]
  steps:
  - task: PowerShell@2
    inputs:
      targetType: inline
      script: |
        Write-Verbose -Verbose "Release Tag: $(ReleaseTag)"
        Get-ChildItem $(Pipeline.Workspace) -Recurse | Select-Object -ExpandProperty FullName
    displayName: 'Capture ReleaseTag and Downloaded Packages'

  - task: PowerShell@2
    condition: or(eq(variables['LTS'], 'true'), eq(variables['STABLE'], 'true'), eq(variables['PREVIEW'], 'true'))
    inputs:
      targetType: inline
      script: |
        if ("$(ReleaseTag)" -eq '') {
          Write-Error "ReleaseTag is not set. Cannot proceed with publishing to the Store."
          exit 1
        }
        $middleURL = ''
        $tagString = "$(ReleaseTag)"
        if ($tagString -match '-preview') {
          $middleURL = "preview"
        }
        elseif ($tagString -match '(\d+\.\d+)') {
          $middleURL = $matches[1]
        }

        $endURL = $tagString -replace '^v','' -replace '\.',''
        $changelogLink = "https://github.com/PowerShell/PowerShell/blob/master/CHANGELOG/$middleURL.md#$endURL"
        Write-Verbose -Verbose "Release Notes for the Store:"
        $jsonPath = "$(Pipeline.Workspace)\SBOutDir\PowerShellStorePackage.json"
        $json = Get-Content $jsonPath -Raw | ConvertFrom-Json

        $listingProperties = @($json.listings.PSObject.Properties)
        if ($listingProperties.Count -eq 0) {
          throw "Store listings are missing from '$jsonPath'."
        }

        foreach ($listingProperty in $listingProperties) {
          $language = $listingProperty.Name
          $baseListing = $listingProperty.Value.baseListing

          $description = $baseListing.description
          if ([string]::IsNullOrWhiteSpace($description)) {
            throw "Store description for '$language' is missing from '$jsonPath'."
          }

          $releaseNotes = $baseListing.releaseNotes
          if ([string]::IsNullOrWhiteSpace($releaseNotes)) {
            throw "Store release notes for '$language' are missing from '$jsonPath'."
          }

          # Localized listings may retain the version in release notes until localization propagates the en-US change.
          if ($description.Contains('___VERSION___')) {
            $baseListing.description = $description.Replace('___VERSION___', $tagString)
          }
          elseif ($releaseNotes.Contains('___VERSION___')) {
            $releaseNotes = $releaseNotes.Replace('___VERSION___', $tagString)
          }
          else {
            throw "Store listing for '$language' does not contain the required placeholder '___VERSION___'."
          }

          if (-not $releaseNotes.Contains('___CHANGELOGLINK___')) {
            throw "Store release notes for '$language' do not contain the required placeholder '___CHANGELOGLINK___'."
          }
          $baseListing.releaseNotes = $releaseNotes.Replace('___CHANGELOGLINK___', $changelogLink)

          Write-Verbose -Verbose "Release notes for '$language':"
          Write-Verbose -Verbose $baseListing.releaseNotes
        }

        $json | ConvertTo-Json -Depth 100 | Set-Content $jsonPath -Encoding UTF8
    displayName: 'Set Store Listing Variables'

  - task: PowerShell@2
    condition: or(eq(variables['LTS'], 'true'), eq(variables['STABLE'], 'true'), eq(variables['PREVIEW'], 'true'))
    inputs:
      targetType: inline
      script: |
        # Convert ADO variables to PowerShell boolean variables
        $IsLTS = '$(LTS)' -eq 'true'
        $IsStable = '$(STABLE)' -eq 'true'
        $IsPreview = '$(PREVIEW)' -eq 'true'

        Write-Verbose -Verbose "Channel Selection - LTS: $(LTS), Stable: $(STABLE), Preview: $(PREVIEW)"

        $currentChannel = if ($IsLTS) { 'LTS' }
          elseif ($IsStable) { 'Stable' }
          elseif ($IsPreview) { 'Preview' }
          else { $null }

        if (-not $currentChannel) {
          Write-Host "##[warning]No release channel selected (LTS/Stable/Preview all false). Skipping Store publish."
          return
        }

        # Assign AppID for Store-Publish Task
        $appID = $null
        if ($IsLTS) {
          $appID = '$(AppID-LTS)'
        }
        elseif ($IsStable) {
          $appID = '$(AppID-Stable)'
        }
        else {
          $appID = '$(AppID-Preview)'
        }

        Write-Host "##vso[task.setvariable variable=AppID]$appID"
        Write-Verbose -Verbose "Selected channel: $currentChannel"
        Write-Verbose -Verbose "Conditional tasks will handle the publishing based on channel variables"
    displayName: 'Validate Channel Selection'

  - task: MS-RDX-MRO.windows-store-publish.publish-task.store-publish@3
    displayName: 'Publish StoreBroker Package (Stable/LTS)'
    condition: and(not(${{ parameters.skipMSIXPublish }}), or(eq(variables['STABLE'], 'true'), eq(variables['LTS'], 'true')))
    inputs:
      serviceEndpoint: 'StoreAppPublish-Stable'
      appId: '$(AppID)'
      inputMethod: JsonAndZip
      jsonPath: '$(Pipeline.Workspace)\SBOutDir\PowerShellStorePackage.json'
      zipPath: '$(Pipeline.Workspace)\SBOutDir\PowerShellStorePackage.zip'
      force: true
      deletePackages: true
      numberOfPackagesToKeep: 2
      jsonZipUpdateMetadata: true
      targetPublishMode: 'Immediate'
      skipPolling: true

  - task: MS-RDX-MRO.windows-store-publish.publish-task.store-publish@3
    displayName: 'Publish StoreBroker Package (Preview)'
    condition: and(not(${{ parameters.skipMSIXPublish }}), eq(variables['PREVIEW'], 'true'))
    inputs:
      serviceEndpoint: 'StoreAppPublish-Preview'
      appId: '$(AppID)'
      inputMethod: JsonAndZip
      jsonPath: '$(Pipeline.Workspace)\SBOutDir\PowerShellStorePackage.json'
      zipPath: '$(Pipeline.Workspace)\SBOutDir\PowerShellStorePackage.zip'
      force: true
      deletePackages: true
      numberOfPackagesToKeep: 2
      jsonZipUpdateMetadata: true
      targetPublishMode: 'Immediate'
      skipPolling: true
