parameters:
  - name: jobName
    type: string
    default: ""
  - name: displayName
    type: string
    default: ""
  - name: poolName
    type: string
    default: "windows"
  - name: imageName
    type: string
    default: 'none'
  - name: IsEarlyAccess
    type: boolean
    default: false
  - name: DOTNET_RUNTIME_VERSION
    displayName: Runtime version of early access build
    type: string
    default: ' '
  - name: DOTNET_SDK_VERSION
    displayName: SDK version of early access build
    type: string
    default: ' '
  - name: dotnetArch
    type: string
    default: 'win-x64'
  - name: EarlyAccessFeed
    type: string
    default: 'net10'

jobs:
- job: ${{ parameters.jobName }}
  displayName: ${{ parameters.displayName }}
  pool:
    type: linux
    isCustom: true
    ${{ if eq( parameters.poolName, 'Azure Pipelines') }}:
      name: ${{ parameters.poolName }}
      vmImage: ${{ parameters.imageName }}
    ${{ else }}:
      name: ${{ parameters.poolName }}
      demands:
        - ImageOverride -equals ${{ parameters.imageName }}

  variables:
  - group: mscodehub-feed-read-general
  - group: mscodehub-feed-read-akv
  - group: DotNetPrivateBuildAccess
  - name: ISEARLYACCESS
    value: ${{ parameters.IsEarlyAccess }}
  - name: EARLY_ACCESS_FEED
    value: ${{ parameters.EarlyAccessFeed }}

  steps:
    - checkout: self
      clean: true
      lfs: false

    - template: /.pipelines/templates/SetVersionVariables.yml@self
      parameters:
        ReleaseTagVar: $(ReleaseTagVar)

    - template: release-SetReleaseTagandContainerName.yml@self

    - download: PSPackagesOfficial
      artifact: drop_nupkg_build_nupkg
      displayName: Download nupkgs

    - pwsh: |
        Get-ChildItem -Path env:
      displayName: Capture environment

    - pwsh: |
        Get-ChildItem "$(Pipeline.Workspace)/PSPackagesOfficial/drop_nupkg_build_nupkg" -Recurse
      displayName: 'Capture Downloaded Artifacts'

    - template: /.pipelines/templates/install-dotnet.yml@self
      parameters:
        ob_restore_phase: false
        architecture: ${{ parameters.dotnetArch }}

    - template: /.pipelines/templates/insert-nuget-config-azfeed.yml@self

    - pwsh: |
        $repoRoot = "$(Build.SourcesDirectory)"

        Import-Module "$repoRoot/build.psm1" -Force -Verbose
        Start-PSBootstrap -Scenario Dotnet

        $env:DOTNET_NOLOGO=1

        $isEarlyAccess = '$(ISEARLYACCESS)'

        $ADORepoUri = if ($isEarlyAccess -eq 'True')
          {
            $earlyAccessFeed = '$(EARLY_ACCESS_FEED)'
            switch ($earlyAccessFeed) {
                  'net8' { 'https://pkgs.dev.azure.com/powershell-rel/PowerShell/_packaging/powershell-net-8-early-access/nuget/v3/index.json' }
                  'net9' { 'https://pkgs.dev.azure.com/powershell-rel/PowerShell/_packaging/powershell-net-9-early-access/nuget/v3/index.json' }
                  'net10' { 'https://pkgs.dev.azure.com/powershell-rel/PowerShell/_packaging/powershell-net-10-early-access/nuget/v3/index.json' }
                  default { throw "Unknown early access feed URL: $earlyAccessFeed" }
              }
          }
          else {
            "https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet9/nuget/v3/index.json"
          }

        Write-Verbose -Verbose "ADO Repo URI: $ADORepoUri"

        $localLocation = "$(Pipeline.Workspace)/PSPackagesOfficial/drop_nupkg_build_nupkg"
        $xmlElement = @"
          <add key=`"local`" value=`"$localLocation`" />
          <add key=`"dotnet`" value=`"$ADORepoUri`" />
        </packageSources>
        "@

        $releaseVersion = '$(OutputVersion.Version)'

        Write-Verbose -Message "Release Version: $releaseVersion" -Verbose

        Set-Location -Path $repoRoot/test/hosting

        Get-ChildItem

        ## register the packages download directory in the nuget file
        $nugetPath = './NuGet.Config'
        if(!(test-path $nugetPath)) {
          $nugetPath = "$repoRoot/nuget.config"
        }
        Write-Verbose -Verbose "nugetPath: $nugetPath"
        $nugetConfigContent = Get-Content $nugetPath -Raw
        $updateNugetContent = $nugetConfigContent.Replace("</packageSources>", $xmlElement)

        $updateNugetContent | Out-File $nugetPath -Encoding ascii

        Get-Content $nugetPath

        dotnet --info
        dotnet restore
        dotnet test /property:RELEASE_VERSION=$releaseVersion --test-adapter-path:. "--logger:xunit;LogFilePath=$(System.DefaultWorkingDirectory)/test-hosting.xml"
      displayName: Restore and execute tests
      env:
        __DOTNET_RUNTIME_FEED_KEY: $(RUNTIME_SOURCEFEED_KEY)
        VSS_NUGET_EXTERNAL_FEED_ENDPOINTS: $(VSS_NUGET_EXTERNAL_FEED_ENDPOINTS)

    - task: PublishTestResults@2
      displayName: 'Publish Test Results **\test-hosting.xml'
      inputs:
        testResultsFormat: XUnit
        testResultsFiles: '**\test-hosting.xml'
