parameters:
- name: "repoRoot"
  default: $(REPOROOT)
- name: "ob_restore_phase"
  type: boolean
  default: true

steps:
- task: NuGetAuthenticate@1
  displayName: Install Azure Artifacts Credential Provider
  inputs:
    forceReinstallCredentialProvider: true

- pwsh: |
    try {
      $configPath = "${env:NugetConfigDir}/nuget.config"
      Import-Module ${{ parameters.repoRoot }}/build.psm1 -Force

      $earlyAccess = $env:ISEARLYACCESS -eq 'true'
      $useEarlyAccessModules = $env:USEEARLYACCESSMODULES -eq 'true'

      Write-Verbose -Verbose "Is Early access: $earlyAccess"

      if (-not $earlyAccess)
      {
        Write-Verbose -Verbose "Running: Switch-PSNugetConfig -Source Private -UserName '$(AzDevopsFeedUserNameKVPAT)' -ClearTextPAT '$(powershellPackageReadPat)'"
        Switch-PSNugetConfig -Source Private -UseEarlyAccessModules:$useEarlyAccessModules -UserName '$(AzDevopsFeedUserNameKVPAT)' -ClearTextPAT '$(powershellPackageReadPat)'
      }
      else
      {
        Write-Verbose -Verbose "Running: Switch-PSNugetConfig -Source EarlyAccess (using Azure DevOps feed credentials from pipeline variables)"
        Switch-PSNugetConfig -Source EarlyAccess -UseEarlyAccessModules:$useEarlyAccessModules -UserName '$(AzDevopsFeedUserNameKVPAT)' -ClearTextPAT '$(powershellPackageReadPat)'
      }

      if(-not (Test-Path $configPath))
      {
          throw "nuget.config is not created"
      }
    }
    catch {
      Get-Error
      throw
    }
  displayName: 'Switch to production Azure DevOps feed for all nuget.configs'
  condition: and(succeededOrFailed(), or(ne(variables['UseAzDevOpsFeed'], ''), eq(variables['UseEarlyAccessModules'], 'true')))
  env:
    NugetConfigDir: ${{ parameters.repoRoot }}/src/Modules
    ob_restore_phase: ${{ parameters.ob_restore_phase }}

- task: AzureCLI@2
  inputs:
    azureSubscription: powershell-net-early-access
    scriptType: pscore
    scriptLocation: inlineScript
    inlineScript: |
      Write-Verbose -Verbose "Getting an Azure DevOps access token"
      # Microsoft's well-known Entra resource ID for the Azure DevOps token audience.
      $azureDevOpsResourceUrl = '499b84ac-1321-427f-aa17-267ca6975798'
      $azt = az account get-access-token --resource $azureDevOpsResourceUrl --query accessToken --output tsv
      if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($azt)) {
        throw "Failed to get an Azure DevOps access token."
      }

      Write-Host "##vso[task.setsecret]$azt"
      Write-Verbose -Verbose "Setting up Azure Artifacts Credential Provider token"

      $powerShellRepoUri = 'https://pkgs.dev.azure.com/powershell/PowerShell/_packaging/PowerShell/nuget/v3/index.json'
      $endpointCredentials = @(
        @{
          endpoint = $powerShellRepoUri
          username = '$(AzDevopsFeedUserNameKVPAT)'
          password = '$(powershellPackageReadPat)'
        }
      )

      if ($env:ISEARLYACCESS -eq 'true') {
        $earlyAccessFeed = '$(EARLY_ACCESS_FEED)'
        $ADORepoUri = switch ($earlyAccessFeed) {
            'net8' { 'https://pkgs.dev.azure.com/powershell-rel/PowerShell/_packaging/powershell-net-8-early-access/nuget/v3/index.json' }
            'net9' { 'https://pkgs.dev.azure.com/powershell-rel/PowerShell/_packaging/powershell-net-9-early-access/nuget/v3/index.json' }
            'net10' { 'https://pkgs.dev.azure.com/powershell-rel/PowerShell/_packaging/powershell-net-10-early-access/nuget/v3/index.json' }
            'net11' { 'https://pkgs.dev.azure.com/powershell-rel/PowerShell/_packaging/powershell-net-11-early-access/nuget/v3/index.json' }
            default { throw "Unknown early access feed URL: $earlyAccessFeed" }
        }
        $endpointCredentials += @{ endpoint = $ADORepoUri; password = $azt }
      }

      if ($env:USEEARLYACCESSMODULES -eq 'true') {
        $moduleEarlyAccessRepoUri = 'https://pkgs.dev.azure.com/powershell-rel/PowerShell/_packaging/powershell-module-earlyaccess/nuget/v3/index.json'
        $endpointCredentials += @{ endpoint = $moduleEarlyAccessRepoUri; password = $azt }
      }

      $endpointCredsObj = @{ endpointCredentials = $endpointCredentials }
      $VSS_NUGET_EXTERNAL_FEED_ENDPOINTS = $endpointCredsObj | ConvertTo-Json -Compress
      Write-Host "##vso[task.setvariable variable=VSS_NUGET_EXTERNAL_FEED_ENDPOINTS;issecret=true]$VSS_NUGET_EXTERNAL_FEED_ENDPOINTS"
  displayName: 'Setup Azure Artifacts Credential Provider secret'
  condition: and(succeeded(), or(eq(variables['ISEARLYACCESS'], 'true'), eq(variables['UseEarlyAccessModules'], 'true')))
  env:
    ob_restore_phase: ${{ parameters.ob_restore_phase }}


- pwsh: |
    Get-ChildItem ${{ parameters.repoRoot }}/nuget.config -Recurse | Foreach-Object {
      Write-Verbose -Verbose "--- START $($_.fullname) ---"
      get-content $_.fullname  | Out-String -width 9999 -Stream | write-Verbose -Verbose
      Write-Verbose -Verbose "--- END $($_.fullname) ---"
    }
  displayName: 'Capture all nuget.config files'
  condition: and(succeededOrFailed(), ne(variables['UseAzDevOpsFeed'], ''))
  env:
    ob_restore_phase: ${{ parameters.ob_restore_phase }}

- pwsh: |
    Get-ChildItem -Path env:VSS* | Out-String -width 9999 -Stream | write-Verbose -Verbose
  displayName: Capture VSS* Environment
  condition: and(succeededOrFailed(), ne(variables['UseAzDevOpsFeed'], ''))
  env:
    ob_restore_phase: ${{ parameters.ob_restore_phase }}
