parameters:
  - name: jobName
    type: string
    default: ""
  - name: displayName
    type: string
    default: ""
  - name: jobtype
    type: string
    default: "windows"
  - name: imageName
    type: string
    default: ''
  - name: artifactName
    type: string
    default: 'drop_nupkg_build_nupkg'
  - name: globalToolExeName
    type: string
    default: 'pwsh.exe'
  - name: globalToolPackageName
    type: string
    default: 'PowerShell.Windows.x64'
  - name: IsEarlyAccess
    type: boolean
    default: false
  - name: DOTNET_RUNTIME_VERSION
    displayName: Runtime version of early access build
    type: string
    default: ' '
  - name: DOTNET_SDK_VERSION
    displayName: SDK version of early access build
    type: string
    default: ' '
  - name: dotnetArch
    type: string
    default: 'win-x64'

jobs:
- job: ${{ parameters.jobName }}
  displayName: ${{ parameters.displayName }}
  pool:
    type: ${{ parameters.jobtype }}
    ${{ if ne(parameters.imageName, '') }}:
      isCustom: true
      name: Azure Pipelines
      vmImage: ${{ parameters.imageName }}
  variables:
    - group: DotNetPrivateBuildAccess
    - name: ob_outputDirectory
      value: '$(Build.ArtifactStagingDirectory)/ONEBRANCH_ARTIFACT'
    - name: ob_sdl_credscan_suppressionsFile
      value: $(Build.SourcesDirectory)\PowerShell\.config\suppress.json
    - name: ob_sdl_tsa_configFile
      value: $(Build.SourcesDirectory)\PowerShell\.config\tsaoptions.json
    - name: ISEARLYACCESS
      value: ${{ parameters.IsEarlyAccess }}

  steps:
    - checkout: self
      clean: true

    - template: /.pipelines/templates/SetVersionVariables.yml@self
      parameters:
        ReleaseTagVar: $(ReleaseTagVar)

    - template: release-SetReleaseTagandContainerName.yml@self

    - download: PSPackagesOfficial
      artifact: ${{ parameters.artifactName }}
      displayName: Download nupkgs

    - pwsh: |
        Get-ChildItem -Path env: | Out-String -width 9999 -Stream | write-Verbose -Verbose
      displayName: Capture environment

    - pwsh: |
        Get-ChildItem "$(Pipeline.Workspace)/PSPackagesOfficial/${{ parameters.artifactName }}" -Recurse
      displayName: 'Capture Downloaded Artifacts'

    - template: /.pipelines/templates/install-dotnet.yml@self
      parameters:
        architecture: ${{ parameters.dotnetArch }}
        ob_restore_phase: false

    - pwsh: |
        $repoRoot = "$(RepoRoot)"
        if (-not (Test-Path "$repoRoot/build.psm1")) {
          $repoRoot = Join-Path $repoRoot 'PowerShell'
        }

        Import-Module "$repoRoot/build.psm1" -Force -Verbose
        Start-PSBootstrap -Scenario Dotnet

        $toolPath = New-Item -ItemType Directory "$(System.DefaultWorkingDirectory)/toolPath" | Select-Object -ExpandProperty FullName

        Write-Verbose -Verbose "dotnet tool list -g"
        dotnet tool list -g

        $packageName = '${{ parameters.globalToolPackageName }}'
        Write-Verbose -Verbose "Installing $packageName"

        dotnet tool install --source "$ENV:PIPELINE_WORKSPACE/PSPackagesOfficial/${{ parameters.artifactName }}" --no-http-cache --tool-path $toolPath --version '$(OutputVersion.Version)' $packageName
        if ($LASTEXITCODE -ne 0) {
          throw "Failed to install $packageName (exit code $LASTEXITCODE)"
        }

        Get-ChildItem -Path $toolPath

      displayName: Install global tool
      env:
        __DOTNET_RUNTIME_FEED_KEY: $(RUNTIME_SOURCEFEED_KEY)
        NUGET_PACKAGES: $(Agent.TempDirectory)/globaltool-packages

    - pwsh: |
        $toolPath = "$(System.DefaultWorkingDirectory)/toolPath/${{ parameters.globalToolExeName }}"

        if (-not (Test-Path $toolPath))
        {
            throw "Tool is not installed at $toolPath"
        }
        else
        {
            Write-Verbose -Verbose "Tool found at: $toolPath"
        }
      displayName: Validate tool is installed

    - pwsh: |
        $repoRoot = "$(RepoRoot)"
        if (-not (Test-Path "$repoRoot/build.psm1")) {
          $repoRoot = Join-Path $repoRoot 'PowerShell'
        }

        Import-Module "$repoRoot/build.psm1" -Force -Verbose
        Start-PSBootstrap -Scenario Dotnet

        $toolPath = "$(System.DefaultWorkingDirectory)/toolPath/${{ parameters.globalToolExeName }}"

        $dotnet = Get-Item (Get-Command -Type Application -Name dotnet | Select-Object -First 1 -ExpandProperty Source)
        if ($dotnet.LinkType) {
          $dotnet = $dotnet.ResolveLinkTarget($true)
        }
        $env:DOTNET_ROOT = $dotnet.DirectoryName

        Write-Verbose -Verbose "DOTNET_ROOT: $env:DOTNET_ROOT"
        Get-ChildItem $env:DOTNET_ROOT

        $versionFound = & $toolPath -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
        if ($LASTEXITCODE -ne 0) {
            throw "Global tool version check failed (exit code $LASTEXITCODE)"
        }

        if ( '$(OutputVersion.Version)' -ne $versionFound)
        {
            throw "Expected version of global tool not found. Installed version is $versionFound"
        }
        else
        {
            write-verbose -verbose "Found expected version: $versionFound"
        }

        $dateYear = & $toolPath -NoLogo -NoProfile -Command '(Get-Date).Year'
        if ($LASTEXITCODE -ne 0) {
            throw "Global tool Get-Date check failed (exit code $LASTEXITCODE)"
        }

        if ( $dateYear -ne [DateTime]::Now.Year)
        {
            throw "Get-Date returned incorrect year: $dateYear"
        }
        else
        {
            write-verbose -verbose "Got expected year: $dateYear"
        }
      displayName: Basic validation
      env:
        __DOTNET_RUNTIME_FEED_KEY: $(RUNTIME_SOURCEFEED_KEY)
