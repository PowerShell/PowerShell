name: apiscan-genNotice-$(BUILD.SOURCEBRANCHNAME)-$(Build.BuildId)
trigger: none

parameters:
  - name: IsEarlyAccess
    type: boolean
    default: false
  - name: EarlyAccessFeed
    displayName: Early Access Feed
    type: string
    default: 'net10'
    values:
      - 'net8'
      - 'net9'
      - 'net10'
  - name: DOTNET_RUNTIME_VERSION
    displayName: Runtime version of early access build
    type: string
    default: ' '
  - name: DOTNET_SDK_VERSION
    displayName: SDK version of early access build
    type: string
    default: ' '
  - name: FORCE_CODEQL
    displayName: Debugging - Enable CodeQL and set cadence to 1 hour
    type: boolean
    default: false

variables:
  # PAT permissions NOTE: Declare a SymbolServerPAT variable in this group with a 'microsoft' organizanization scoped PAT with 'Symbols' Read permission.
  # A PAT in the wrong org will give a single Error 203. No PAT will give a single Error 401, and individual pdbs may be missing even if permissions are correct.
  - group: symbols
  - name: ob_outputDirectory
    value: '$(Build.ArtifactStagingDirectory)/ONEBRANCH_ARTIFACT'
  - name: CDP_DEFINITION_BUILD_COUNT
    value: $[counter('', 0)]
  # Defines the variables AzureFileCopySubscription, StorageAccount, StorageAccountKey, StorageResourceGroup, StorageSubscriptionName
  - group: 'Azure Blob variable group'
  # Defines the variables CgPat, CgOrganization, and CgProject
  - group: 'ComponentGovernance'
  - group: 'PoolNames'
  - name: EARLY_ACCESS_FEED
    value: ${{ parameters.EarlyAccessFeed }}
  - name: IsEarlyAccess
    value: ${{ parameters.IsEarlyAccess }}
  - name: LinuxContainerImage
    value: mcr.microsoft.com/onebranch/azurelinux/build:3.0
  - name: WindowsContainerImage
    value: onebranch.azurecr.io/windows/ltsc2022/vse2022:latest
  - ${{ if eq(parameters['FORCE_CODEQL'],'true') }}:
    # Cadence is hours before CodeQL will allow a re-upload of the database
    - name: CodeQL.Cadence
      value: 0
  - name: CODEQL_ENABLED
    ${{ if or(eq(variables['Build.SourceBranch'], 'refs/heads/master'), eq(parameters['FORCE_CODEQL'],'true')) }}:
      value: true
    ${{ else }}:
      value: false
  - name: Codeql.TSAEnabled
    value: $(CODEQL_ENABLED)
  # AnalyzeInPipeline: false = upload results
  # AnalyzeInPipeline: true = do not upload results
  - name: Codeql.AnalyzeInPipeline
    ${{ if or(eq(variables['Build.SourceBranch'], 'refs/heads/master'), eq(parameters['FORCE_CODEQL'],'true')) }}:
      value: false
    ${{ else }}:
      value: true

resources:
  repositories:
  - repository: templates
    type: git
    name: OneBranch.Pipelines/GovernedTemplates
    ref: refs/heads/main

extends:
  template: v2/OneBranch.NonOfficial.CrossPlat.yml@templates
  parameters:
    featureFlags:
      WindowsHostVersion:
        Version: 2022
    globalSdl:
      codeql:
        compiled:
          enabled: $(CODEQL_ENABLED)
        tsaEnabled: $(CODEQL_ENABLED) # This enables TSA bug filing only for CodeQL 3000
      armory:
        enabled: false
      sbom:
        enabled: false
      cg:
        enabled: true
        ignoreDirectories: '.devcontainer,demos,docker,docs,src,test,tools/packaging'
      tsa:
        enabled: true  # onebranch publish all SDL results to TSA. If TSA is disabled all SDL tools will forced into 'break' build mode.
      credscan:
        enabled: true
        scanFolder:  $(Build.SourcesDirectory)
        suppressionsFile: $(Build.SourcesDirectory)\.config\suppress.json
      binskim:
        break: true  # always break the build on binskim issues in addition to TSA upload
      policheck:
        break: true  # always break the build on policheck issues. You can disable it by setting to 'false'
      # APIScan requires a non-Ready-To-Run build
      apiscan:
        enabled: true
        softwareName: "PowerShell" # Default is repo name
        versionNumber: "7.6" # Default is build number
        isLargeApp: false # Default: false.
        symbolsFolder: $(SymbolsServerUrl);$(ob_outputDirectory)
#softwareFolder - relative path to a folder to be scanned. Default value is root of artifacts folder.

      tsaOptionsFile: .config\tsaoptions.json

    stages:
      - stage: prep
        displayName: 'Prepare early access .NET'
        dependsOn: []
        jobs:
          - ${{ if eq(parameters.IsEarlyAccess, true) }}:
            - template: /.pipelines/templates/downloadDotnetEarlyAccess.yml@self
              parameters:
                DotnetRuntimeVersion: ${{ parameters.DOTNET_RUNTIME_VERSION }}
                DotnetSdkVersion: ${{ parameters.DOTNET_SDK_VERSION }}
          - ${{ else }}:
            - job: skip_download_dotnet_early_access
              displayName: 'Skip early access .NET download'
              pool:
                type: windows
              variables:
                - name: ob_outputDirectory
                  value: '$(Build.ArtifactStagingDirectory)/ONEBRANCH_ARTIFACT'
                - name: ob_signing_setup_enabled
                  value: false
                - name: ob_sdl_codeSignValidation_enabled
                  value: false
              steps:
                - pwsh: Write-Host 'IsEarlyAccess is false; skipping early access .NET download.'
      - stage: APIScan
        displayName: 'ApiScan'
        dependsOn: [prep]
        jobs:
          - template: /.pipelines/templates/compliance/apiscan.yml@self
            parameters:
              parentJobs: []
      - stage: notice
        displayName: Generate Notice File
        dependsOn: []
        jobs:
          - template: /.pipelines/templates/compliance/generateNotice.yml@self
            parameters:
              parentJobs: []
