parameters:
  - name: OfficialBuild
    type: boolean

stages:
  - stage: prep
    displayName: Prep BuildInfo+Az
    jobs:
      - template: /.pipelines/1ES/templates/checkAzureContainer.yml@self

  - stage: mac_package
    displayName: macOS Pkg+Sign
    dependsOn: []
    jobs:
      - template: /.pipelines/1ES/templates/mac-package-build.yml@self
        parameters:
          buildArchitecture: x64
          OfficialBuild: ${{ parameters.OfficialBuild }}
      - template: /.pipelines/1ES/templates/mac-package-build.yml@self
        parameters:
          buildArchitecture: arm64
          OfficialBuild: ${{ parameters.OfficialBuild }}

  - stage: windows_package_build
    displayName: Win Pkg (unsigned)
    dependsOn: []
    jobs:
      - template: /.pipelines/1ES/templates/packaging/windows/package.yml@self
        parameters:
          runtime: x64
      - template: /.pipelines/1ES/templates/packaging/windows/package.yml@self
        parameters:
          runtime: arm64
      - template: /.pipelines/1ES/templates/packaging/windows/package.yml@self
        parameters:
          runtime: x86
      - template: /.pipelines/1ES/templates/packaging/windows/package.yml@self
        parameters:
          runtime: fxdependent
      - template: /.pipelines/1ES/templates/packaging/windows/package.yml@self
        parameters:
          runtime: fxdependentWinDesktop
      - template: /.pipelines/1ES/templates/packaging/windows/package.yml@self
        parameters:
          runtime: x64_minsize
      - template: /.pipelines/1ES/templates/packaging/windows/package.yml@self
        parameters:
          runtime: arm64_minsize

  - stage: windows_package_sign
    displayName: Win Pkg Sign
    dependsOn: [windows_package_build]
    jobs:
      - template: /.pipelines/1ES/templates/packaging/windows/sign.yml@self
        parameters:
          runtime: x64
          OfficialBuild: ${{ parameters.OfficialBuild }}
      - template: /.pipelines/1ES/templates/packaging/windows/sign.yml@self
        parameters:
          runtime: arm64
          OfficialBuild: ${{ parameters.OfficialBuild }}
      - template: /.pipelines/1ES/templates/packaging/windows/sign.yml@self
        parameters:
          runtime: x86
          OfficialBuild: ${{ parameters.OfficialBuild }}
      - template: /.pipelines/1ES/templates/packaging/windows/sign.yml@self
        parameters:
          runtime: fxdependent
          OfficialBuild: ${{ parameters.OfficialBuild }}
      - template: /.pipelines/1ES/templates/packaging/windows/sign.yml@self
        parameters:
          runtime: fxdependentWinDesktop
          OfficialBuild: ${{ parameters.OfficialBuild }}
      - template: /.pipelines/1ES/templates/packaging/windows/sign.yml@self
        parameters:
          runtime: x64_minsize
          OfficialBuild: ${{ parameters.OfficialBuild }}
      - template: /.pipelines/1ES/templates/packaging/windows/sign.yml@self
        parameters:
          runtime: arm64_minsize
          OfficialBuild: ${{ parameters.OfficialBuild }}

  - stage: linux_package
    displayName: Linux Pkg+Sign
    dependsOn: []
    jobs:
      - template: /.pipelines/1ES/templates/linux-package-build.yml@self
        parameters:
          unsignedDrop: drop_linux_build_linux_x64
          signedDrop: drop_linux_sign_linux_x64
          packageType: deb
          jobName: deb
          OfficialBuild: ${{ parameters.OfficialBuild }}
      - template: /.pipelines/1ES/templates/linux-package-build.yml@self
        parameters:
          unsignedDrop: drop_linux_build_linux_arm64
          signedDrop: drop_linux_sign_linux_arm64
          packageType: deb-arm64
          jobName: deb_arm64
          OfficialBuild: ${{ parameters.OfficialBuild }}
      - template: /.pipelines/1ES/templates/linux-package-build.yml@self
        parameters:
          unsignedDrop: drop_linux_build_linux_fxd_x64_mariner
          signedDrop: drop_linux_sign_linux_fxd_x64_mariner
          packageType: rpm-fxdependent
          jobName: mariner_x64
          OfficialBuild: ${{ parameters.OfficialBuild }}
      - template: /.pipelines/1ES/templates/linux-package-build.yml@self
        parameters:
          unsignedDrop: drop_linux_build_linux_fxd_arm64_mariner
          signedDrop: drop_linux_sign_linux_fxd_arm64_mariner
          packageType: rpm-fxdependent-arm64
          jobName: mariner_arm64
          OfficialBuild: ${{ parameters.OfficialBuild }}
      - template: /.pipelines/1ES/templates/linux-package-build.yml@self
        parameters:
          unsignedDrop: drop_linux_build_linux_x64
          signedDrop: drop_linux_sign_linux_x64
          packageType: rpm
          jobName: rpm
          OfficialBuild: ${{ parameters.OfficialBuild }}
      - template: /.pipelines/1ES/templates/linux-package-build.yml@self
        parameters:
          unsignedDrop: drop_linux_build_linux_arm
          signedDrop: drop_linux_sign_linux_arm
          packageType: tar-arm
          jobName: tar_arm
          OfficialBuild: ${{ parameters.OfficialBuild }}
      - template: /.pipelines/1ES/templates/linux-package-build.yml@self
        parameters:
          unsignedDrop: drop_linux_build_linux_arm64
          signedDrop: drop_linux_sign_linux_arm64
          packageType: tar-arm64
          jobName: tar_arm64
          OfficialBuild: ${{ parameters.OfficialBuild }}
      - template: /.pipelines/1ES/templates/linux-package-build.yml@self
        parameters:
          unsignedDrop: drop_linux_build_linux_x64_alpine
          signedDrop: drop_linux_sign_linux_x64_alpine
          packageType: tar-alpine
          jobName: tar_alpine
          OfficialBuild: ${{ parameters.OfficialBuild }}
      - template: /.pipelines/1ES/templates/linux-package-build.yml@self
        parameters:
          unsignedDrop: drop_linux_build_linux_fxd
          signedDrop: drop_linux_sign_linux_fxd
          packageType: fxdependent
          jobName: fxdependent
          OfficialBuild: ${{ parameters.OfficialBuild }}
      - template: /.pipelines/1ES/templates/linux-package-build.yml@self
        parameters:
          unsignedDrop: drop_linux_build_linux_x64
          signedDrop: drop_linux_sign_linux_x64
          packageType: tar
          jobName: tar
          OfficialBuild: ${{ parameters.OfficialBuild }}
      - template: /.pipelines/1ES/templates/linux-package-build.yml@self
        parameters:
          unsignedDrop: drop_linux_build_linux_fxd_x64_alpine
          signedDrop: drop_linux_sign_linux_fxd_x64_alpine
          packageType: tar-alpine-fxdependent
          jobName: tar_alpine_fxd
          OfficialBuild: ${{ parameters.OfficialBuild }}
      - template: /.pipelines/1ES/templates/linux-package-build.yml@self
        parameters:
          unsignedDrop: drop_linux_build_linux_x64_minSize
          signedDrop: drop_linux_sign_linux_x64_minSize
          packageType: min-size-x64
          jobName: minSize_x64
          OfficialBuild: ${{ parameters.OfficialBuild }}
      - template: /.pipelines/1ES/templates/linux-package-build.yml@self
        parameters:
          unsignedDrop: drop_linux_build_linux_arm64_minSize
          signedDrop: drop_linux_sign_linux_arm64_minSize
          packageType: min-size-arm64
          jobName: minSize_arm64
          OfficialBuild: ${{ parameters.OfficialBuild }}

  - stage: nupkg
    displayName: NuGet Pkg+Sign
    dependsOn: []
    jobs:
      - template: /.pipelines/1ES/templates/nupkg.yml@self
        parameters:
          OfficialBuild: ${{ parameters.OfficialBuild }}

  - stage: msixbundle
    displayName: MSIX Bundle+Sign
    dependsOn: [windows_package_build]
    jobs:
      - template: /.pipelines/1ES/templates/package-create-msix.yml@self
        parameters:
          OfficialBuild: ${{ parameters.OfficialBuild }}

  - stage: store_package
    displayName: Store Package
    dependsOn: [msixbundle]
    jobs:
      - template: /.pipelines/1ES/templates/package-store-package.yml@self

  - stage: upload
    displayName: Upload
    dependsOn: [prep, mac_package, windows_package_sign, linux_package, nupkg, msixbundle]
    jobs:
      - template: /.pipelines/1ES/templates/uploadToAzure.yml@self

  - stage: validatePackages
    displayName: Validate Packages
    dependsOn: [upload]
    jobs:
      - template: /.pipelines/1ES/templates/release-validate-packagenames.yml@self
