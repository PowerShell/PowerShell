parameters:
  runtime: x64
  OfficialBuild: false

jobs:
- job: sign_win_${{ parameters.runtime }}
  displayName: Sign Windows Packages ${{ parameters.runtime }}
  condition: succeeded()
  # Leave an additional hour beyond the ESRP signing session for setup,
  # artifact transfer, validation, and publication of large MSIX packages.
  timeoutInMinutes: 180
  pool:
    name: PowerShell1ES
    image: MMS2022
    os: windows
  templateContext:
    sdl:
      codeSignValidation:
        enabled: ${{ parameters.OfficialBuild }}
      binskim:
        enabled: true
        exactToolVersion: 4.4.2
      tsa:
        configFile: $(Build.SourcesDirectory)\PowerShell\.config\tsaoptions.json
      credscan:
        suppressionsFile: $(Build.SourcesDirectory)\PowerShell\.config\suppress.json
    outputs:
      - output: pipelineArtifact
        targetPath: $(ob_outputDirectory)
        artifactName: drop_windows_package_package_win_${{ parameters.runtime }}

  variables:
    - name: runCodesignValidationInjection
      value: false
    - name: ob_artifactBaseName
      value: drop_windows_package_package_win_${{ parameters.runtime }}
    - name: nugetMultiFeedWarnLevel
      value: none
    - name: NugetSecurityAnalysisWarningLevel
      value: none
    - name: skipNugetSecurityAnalysis
      value: true
    - group: DotNetPrivateBuildAccess
    - group: certificate_logical_to_actual
    - name: ob_outputDirectory
      value: '$(Build.ArtifactStagingDirectory)\ONEBRANCH_ARTIFACT'
    - name: ob_sdl_binskim_enabled
      value: true
    - name: ob_sdl_tsa_configFile
      value: $(Build.SourcesDirectory)\PowerShell\.config\tsaoptions.json
    - name: ob_sdl_credscan_suppressionsFile
      value: $(Build.SourcesDirectory)\PowerShell\.config\suppress.json
    - name: Runtime
      value: ${{ parameters.runtime }}
    - group: msixTools

  steps:
  - checkout: self
    clean: true

  - template: /.pipelines/templates/SetVersionVariables.yml@self
    parameters:
      ReleaseTagVar: $(ReleaseTagVar)
      CreateJson: no

  - template: /.pipelines/templates/shouldSign.yml@self

  - template: /.pipelines/1ES/templates/stage-repo-under-PowerShell.yml@self

  # Download unsigned packages from the build stage
  - download: current
    artifact: drop_windows_package_${{ parameters.runtime }}
    displayName: Download unsigned packages

  - pwsh: |
      Write-Verbose -Verbose "Downloaded unsigned artifacts:"
      Get-ChildItem "$(Pipeline.Workspace)\drop_windows_package_${{ parameters.runtime }}" -Recurse
    displayName: 'Capture Downloaded Unsigned Artifacts'
    continueOnError: true

  - template: /.pipelines/templates/install-dotnet.yml@self

  # Import build.psm1 and packaging dependencies
  - pwsh: |
      $repoRoot = "$env:REPOROOT"
      Import-Module "$repoRoot\build.psm1"
      Import-Module "$repoRoot\tools\packaging"
      Write-Verbose -Verbose "Modules imported successfully"
    displayName: 'Import modules'

  # The coordinated build artifacts already contain Authenticode-signed
  # binaries. ZIP/fxdependent/min-size packages only wrap those signed files,
  # and ZIP itself is not a SignTool target. MSIX files are signable package
  # containers created unsigned in the preceding stage, so sign those outputs.
  #
  # Historical Windows package signing used MSIX_CERT, whose production value
  # is CP-230012, for standalone .msix files. The separate .msixbundle signing
  # job uses the Dynamic/WINMSAPP1ST Store profile.
  - ${{ if and(eq(parameters.OfficialBuild, true), or(eq(parameters.runtime, 'x64'), eq(parameters.runtime, 'x86'), eq(parameters.runtime, 'arm64'))) }}:
    - task: EsrpCodeSigning@6
      displayName: Sign MSIX packages
      # Keep the task timeout above the ESRP session timeout so the task can
      # finish download, verification, and cleanup after the signing session.
      timeoutInMinutes: 150
      inputs:
        ConnectedServiceName: PowerShell-ESRP-Release
        AppRegistrationClientId: $(EsrpProdAppRegClientId)
        AppRegistrationTenantId: $(EsrpProdAppRegTenantId)
        AuthAKVName: $(EsrpProdAuthAkvName)
        AuthSignCertName: $(EsrpProdAuthSignCertName)
        UseMSIAuthentication: true
        FolderPath: $(Pipeline.Workspace)\drop_windows_package_${{ parameters.runtime }}
        Pattern: |
          **/*.msix
        UseMinimatch: true
        signConfigType: inlineSignParams
        inlineOperation: |
          [
            {
              "keyCode": "CP-230012",
              "operationSetCode": "SigntoolSign",
              "parameters": [
                { "parameterName": "OpusName", "parameterValue": "Microsoft" },
                { "parameterName": "OpusInfo", "parameterValue": "http://www.microsoft.com" },
                { "parameterName": "PageHash", "parameterValue": "/NPH" },
                { "parameterName": "FileDigest", "parameterValue": "/fd \"SHA256\"" },
                { "parameterName": "TimeStamp", "parameterValue": "/tr \"http://rfc3161.gtm.corp.microsoft.com/TSS/HttpTspServer\" /td sha256" }
              ],
              "toolName": "sign",
              "toolVersion": "1.0"
            },
            {
              "keyCode": "CP-230012",
              "operationSetCode": "SigntoolVerify",
              "parameters": [],
              "toolName": "sign",
              "toolVersion": "1.0"
            }
          ]
        SessionTimeout: 120
        MaxConcurrency: 50
        MaxRetryAttempts: 5
        PendingAnalysisWaitTimeoutMinutes: 5

  - ${{ if and(ne(parameters.OfficialBuild, true), or(eq(parameters.runtime, 'x64'), eq(parameters.runtime, 'x86'), eq(parameters.runtime, 'arm64'))) }}:
    - pwsh: Write-Host '##[warning]STUB - skipped ESRP MSIX package signing (CP-230012)'
      displayName: Sign MSIX packages (stub)

  # Copy all signed packages to output directory
  - pwsh: |
      $runtime = '$(Runtime)'
      Write-Verbose -Verbose "runtime = '$(Runtime)'"

      $packageTypes = switch ($runtime) {
        'x64' { @('zip', 'msix') }
        'x86' { @('zip', 'msix') }
        'arm64' { @('zip', 'msix') }
        'fxdependent' { 'fxdependent' }
        'fxdependentWinDesktop' { 'fxdependent-win-desktop' }
        'x64_minsize' { 'min-size-x64' }
        'arm64_minsize' { 'min-size-arm64' }
      }

      if (-not (Test-Path $(ob_outputDirectory))) {
        New-Item -ItemType Directory -Path $(ob_outputDirectory) -Force
      }

      if ($packageTypes -contains 'zip' -or $packageTypes -like 'fxdependent*' -or $packageTypes -like 'min-size*') {
        $zipPkgNameFilter = "powershell-*.zip"
        $zipPkgPath = Get-ChildItem -Path $(Pipeline.Workspace) -Filter $zipPkgNameFilter -Recurse -File | Select-Object -ExpandProperty FullName
        Write-Verbose -Verbose "signed zipPkgPath: $zipPkgPath"
        Copy-Item -Path $zipPkgPath -Destination '$(ob_outputDirectory)' -Force -Verbose
      }

      if ($packageTypes -contains 'msix') {
        $msixPkgNameFilter = "PowerShell*.msix"
        $msixPkgPath = Get-ChildItem -Path $(Pipeline.Workspace) -Filter $msixPkgNameFilter -Recurse -File | Select-Object -ExpandProperty FullName
        Write-Verbose -Verbose "signed msixPkgPath: $msixPkgPath"
        Copy-Item -Path $msixPkgPath -Destination '$(ob_outputDirectory)' -Force -Verbose
      }
    displayName: Copy signed packages to output directory

  - pwsh: |
      Get-ChildItem -Path $(ob_outputDirectory) -Recurse
    displayName: 'List signed artifacts'
