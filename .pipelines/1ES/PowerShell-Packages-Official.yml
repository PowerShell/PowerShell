trigger: none

parameters:
  - name: ForceAzureBlobDelete
    displayName: Delete Azure Blob
    type: string
    values:
      - true
      - false
    default: false
  - name: debug
    displayName: Enable debug output
    type: boolean
    default: false
  - name: InternalSDKBlobURL
    displayName: URL to the blob having internal .NET SDK
    type: string
    default: ' '
  - name: ReleaseTagVar
    displayName: Release Tag
    type: string
    default: fromBranch
  - name: SKIP_SIGNING
    displayName: Skip Signing
    type: string
    default: 'NO'
  - name: disableNetworkIsolation
    type: boolean
    default: false

name: pkgs-$(BUILD.SOURCEBRANCHNAME)-1ES-official-$(Build.BuildId)

variables:
  - template: /.pipelines/templates/variables/PowerShell-Packages-Variables.yml@self
    parameters:
      debug: ${{ parameters.debug }}
      ForceAzureBlobDelete: ${{ parameters.ForceAzureBlobDelete }}
      ReleaseTagVar: ${{ parameters.ReleaseTagVar }}
      disableNetworkIsolation: ${{ parameters.disableNetworkIsolation }}
  - group: EsrpSigning-PowerShell

resources:
  pipelines:
    - pipeline: CoOrdinatedBuildPipeline
      # Build 709038 succeeded from this migrated 1ES definition.
      source: PowerShell-Coordinated_Packages-Official.yml
      trigger:
        branches:
          include:
            - master
            - releases/*
  repositories:
    - repository: 1ESPipelineTemplates
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release
    # Reusable 1ES stage/job/step templates live in the engineering system repo.
    # Pinned to an IMMUTABLE full commit SHA so a later template change can never
    # retroactively alter what this pipeline compiles to. This is a release-critical
    # property for Official builds: the shipped bits must be reproducible.
    #
    # The alias MUST remain `PowerShellEngineeringSystem`: templates in that repo
    # reference their siblings as `@PowerShellEngineeringSystem`, and Azure DevOps
    # resolves repository aliases from THIS (the consuming) pipeline's resources block.
    #
    # Declaring the resource does not check it out at runtime; it is used for
    # compile-time template resolution only. Jobs still `checkout: self`, so all
    # runtime script/asset paths and ESRP signing behaviour are unchanged.
    - repository: PowerShellEngineeringSystem
      type: git
      name: PowerShellCore/PowerShell-Engineering-System
      ref: 8089380bfc3114cd96a823442d1f065bf62c7f2b

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    featureFlags:
      # Match the successful 1ES coordinated build. The new ruleset currently
      # promotes existing style findings to build errors.
      autoEnableRoslynWithNewRuleset: false
    pool:
      name: PowerShell1ES
      image: MMS2022
      os: windows
    sdl:
      codeql:
        compiled:
          enabled: false
      sbom:
        enabled: true
      cg:
        enabled: true
        ignoreDirectories: '.devcontainer,demos,docker,docs,src,test,tools/packaging'
      tsa:
        enabled: true
        configFile: $(Build.SourcesDirectory)\.config\tsaoptions.json
      credscan:
        enabled: true
        scanFolder: $(Build.SourcesDirectory)
        suppressionsFile: $(Build.SourcesDirectory)\.config\suppress.json
      binskim:
        enabled: false
        exactToolVersion: 4.4.2
      apiscan:
        enabled: false
    stages:
      - template: /templates/1ES/stages/PowerShell-Packages-Stages.yml@PowerShellEngineeringSystem
        parameters:
          OfficialBuild: true
