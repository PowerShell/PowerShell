name: Linux-CI

run-name: "${{ github.ref_name }} - ${{ github.run_number }}"

on:
  workflow_dispatch:

  push:
    branches:
      - master
      - release/**
      - github-mirror
      - "servicing-*"
    paths:
      - "**"
      - "*"
      - ".globalconfig"
      - "!.github/ISSUE_TEMPLATE/**"
      - "!.dependabot/config.yml"
      - "!.pipelines/**"
      - "!test/perf/**"
  workflow_call:
    inputs:
      runner_os:
        type: string
        default: ubuntu-24.04
      artifact_name:
        type: string
        default: build
      enable_coverage:
        type: boolean
        default: false
      test_only:
        description: 'Additional architecture: skip packaging and infrastructure checks'
        type: boolean
        default: false
# Path filters for PRs need to go into the changes job

concurrency:
  group: linux-${{ inputs.runner_os || 'ubuntu-24.04' }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ contains(github.ref, 'merge')}}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  FORCE_FEATURE: 'False'
  FORCE_PACKAGE: 'False'
  NUGET_KEY: none
  POWERSHELL_TELEMETRY_OPTOUT: 1
  __SuppressAnsiEscapeSequences: 1
  nugetMultiFeedWarnLevel: none
  system_debug: 'false'
jobs:
  changes:
    if: startsWith(github.repository_owner, 'azure') || github.repository_owner == 'PowerShell'
    name: Change Detection
    runs-on: ubuntu-24.04
    # Required permissions
    permissions:
      pull-requests: read
      contents: read

    # Set job outputs to values from filter step
    outputs:
      source: ${{ steps.filter.outputs.source }}
      buildModuleChanged: ${{ steps.filter.outputs.buildModuleChanged }}
      packagingChanged: ${{ steps.filter.outputs.packagingChanged }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Change Detection
        id: filter
        uses: "./.github/actions/infrastructure/path-filters"
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  merge_conflict_check:
    name: Check for Merge Conflict Markers
    runs-on: ubuntu-24.04
    if: "!inputs.test_only && github.event_name == 'pull_request' && (startsWith(github.repository_owner, 'azure') || github.repository_owner == 'PowerShell')"
    permissions:
      pull-requests: read
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for merge conflict markers
        uses: "./.github/actions/infrastructure/merge-conflict-checker"

  ci_build:
    name: Build PowerShell
    runs-on: ${{ inputs.runner_os || 'ubuntu-24.04' }}
    needs: changes
    if: ${{ inputs.enable_coverage || needs.changes.outputs.source == 'true' || needs.changes.outputs.buildModuleChanged == 'true' }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1000

      - name: Build
        uses: "./.github/actions/build/ci"
        with:
          configuration: ${{ inputs.enable_coverage && 'CodeCoverage' || 'Release' }}
          artifact_name: ${{ inputs.artifact_name || 'build' }}
  linux_test_unelevated_ci:
    name: Linux Unelevated CI
    needs:
      - ci_build
      - changes
    if: ${{ inputs.enable_coverage || needs.changes.outputs.source == 'true' || needs.changes.outputs.buildModuleChanged == 'true' }}
    runs-on: ${{ inputs.runner_os || 'ubuntu-24.04' }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1000
      - name: Linux Unelevated CI
        uses: "./.github/actions/test/nix"
        with:
          artifact_name: ${{ inputs.artifact_name || 'build' }}
          enable_coverage: ${{ inputs.enable_coverage || false }}
          purpose: UnelevatedPesterTests
          tagSet: CI
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  linux_test_elevated_ci:
    name: Linux Elevated CI
    needs:
      - ci_build
      - changes
    if: ${{ inputs.enable_coverage || needs.changes.outputs.source == 'true' || needs.changes.outputs.buildModuleChanged == 'true' }}
    runs-on: ${{ inputs.runner_os || 'ubuntu-24.04' }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1000
      - name: Linux Elevated CI
        uses: "./.github/actions/test/nix"
        with:
          artifact_name: ${{ inputs.artifact_name || 'build' }}
          enable_coverage: ${{ inputs.enable_coverage || false }}
          purpose: ElevatedPesterTests
          tagSet: CI
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  linux_test_unelevated_others:
    name: Linux Unelevated Others
    needs:
      - ci_build
      - changes
    if: ${{ inputs.enable_coverage || needs.changes.outputs.source == 'true' || needs.changes.outputs.buildModuleChanged == 'true' }}
    runs-on: ${{ inputs.runner_os || 'ubuntu-24.04' }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1000
      - name: Linux Unelevated Others
        uses: "./.github/actions/test/nix"
        with:
          artifact_name: ${{ inputs.artifact_name || 'build' }}
          enable_coverage: ${{ inputs.enable_coverage || false }}
          purpose: UnelevatedPesterTests
          tagSet: Others
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  linux_test_elevated_others:
    name: Linux Elevated Others
    needs:
      - ci_build
      - changes
    if: ${{ inputs.enable_coverage || needs.changes.outputs.source == 'true' || needs.changes.outputs.buildModuleChanged == 'true' }}
    runs-on: ${{ inputs.runner_os || 'ubuntu-24.04' }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1000
      - name: Linux Elevated Others
        uses: "./.github/actions/test/nix"
        with:
          artifact_name: ${{ inputs.artifact_name || 'build' }}
          enable_coverage: ${{ inputs.enable_coverage || false }}
          purpose: ElevatedPesterTests
          tagSet: Others
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  xunit_tests:
    name: xUnit Tests
    needs:
      - changes
    if: ${{ inputs.enable_coverage || needs.changes.outputs.source == 'true' || needs.changes.outputs.buildModuleChanged == 'true' }}
    uses: ./.github/workflows/xunit-tests.yml
    with:
      runner_os: ${{ inputs.runner_os || 'ubuntu-24.04' }}
      test_results_artifact_name: testResults-xunit-${{ inputs.artifact_name || 'build' }}
      enable_coverage: ${{ inputs.enable_coverage || false }}

  infrastructure_tests:
    name: Infrastructure Tests
    runs-on: ubuntu-24.04
    if: ${{ !inputs.test_only }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install Pester
        shell: pwsh
        run: |
          Import-Module ./tools/ci.psm1
          Install-CIPester

      - name: Run Infrastructure Tests
        shell: pwsh
        run: |
          $testResultsFolder = Join-Path $PWD "testResults"
          New-Item -ItemType Directory -Path $testResultsFolder -Force | Out-Null

          $config = New-PesterConfiguration
          $config.Run.Path = './test/infrastructure/'
          $config.Run.PassThru = $true
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputFormat = 'NUnitXml'
          $config.TestResult.OutputPath = "$testResultsFolder/InfrastructureTests.xml"
          $config.Output.Verbosity = 'Detailed'

          $result = Invoke-Pester -Configuration $config

          if ($result.FailedCount -gt 0 -or $result.Result -eq 'Failed') {
            throw "Infrastructure tests failed"
          }

      - name: Publish Test Results
        uses: "./.github/actions/test/process-pester-results"
        if: always()
        with:
          name: "InfrastructureTests"
          testResultsFolder: "${{ github.workspace }}/testResults"

  ## Temporarily disable the CodeQL analysis on Linux as it doesn't work for .NET SDK 10-rc.2.
  # analyze:
  #   name: CodeQL Analysis
  #   needs: changes
  #   if: ${{ needs.changes.outputs.source == 'true' }}
  #   uses: ./.github/workflows/analyze-reusable.yml
  #   permissions:
  #     actions: read
  #     contents: read
  #     security-events: write
  #   with:
  #     runner_os: ubuntu-latest

  ready_to_merge:
    name: Linux ready to merge
    needs:
      - xunit_tests
      - linux_test_elevated_ci
      - linux_test_elevated_others
      - linux_test_unelevated_ci
      - linux_test_unelevated_others
      - linux_packaging
      - merge_conflict_check
      - infrastructure_tests
      # - analyze
    if: always()
    uses: PowerShell/compliance/.github/workflows/ready-to-merge.yml@e051ddbdb7865c0a505ce3bf3b2b7abdb50f79d3 # v1.0.0
    with:
      needs_context: ${{ toJson(needs) }}
  linux_packaging:
    name: Linux Packaging
    needs:
      - changes
    if: ${{ !inputs.test_only && needs.changes.outputs.packagingChanged == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Linux Packaging
        uses: "./.github/actions/test/linux-packaging"
